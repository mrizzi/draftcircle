<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>DraftCircle</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/8.0.2/diff.min.js"></script>
</head>
<body>
  <header id="app-header">
    <div class="header-left">
      <h1 class="logo" style="cursor:pointer" id="logo-home">DraftCircle</h1>
      <span id="session-info"></span>
    </div>
    <div class="header-right">
      <span id="progress-indicator"></span>
      <button id="publish-btn" class="btn btn-primary" disabled style="display:none">Publish</button>
    </div>
  </header>

  <main id="app-main">
    <div id="view-session-list" class="view">
      <div class="session-list-header">
        <h2>Sessions</h2>
        <button id="create-session-btn" class="btn btn-primary">New Session</button>
      </div>
      <div id="sessions-container"></div>
    </div>

    <div id="view-create-session" class="view">
      <h2>Create New Session</h2>
      <form id="create-session-form">
        <label for="coordinator-select">You are</label>
        <select id="coordinator-select" required></select>

        <label for="template-select">Template</label>
        <select id="template-select" required></select>

        <label for="seed-text">Seed Material</label>
        <textarea id="seed-text" rows="6" placeholder="Paste requirements, notes, or context..."></textarea>
        <div class="seed-upload-row">
          <input type="file" id="seed-file" accept=".txt,.md,.text" style="display:none">
          <button type="button" id="seed-upload-btn" class="btn btn-secondary">Upload text file</button>
          <span id="seed-file-name" style="font-size:0.8rem;color:var(--text-secondary)"></span>
        </div>

        <div id="section-owners">
          <h3>Section Owners</h3>
          <div id="section-owners-grid"></div>
        </div>

        <div class="form-actions">
          <button type="button" id="cancel-create-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Session</button>
        </div>
      </form>
    </div>

    <div id="view-workspace" class="view">
      <div id="section-sidebar">
        <div id="section-list"></div>
        <div id="sidebar-footer">
          <button id="invite-links-btn" class="btn-link">Invite links</button>
        </div>
      </div>
      <div id="review-area">
        <div id="review-header">
          <h3 id="review-title"></h3>
          <div id="review-actions">
            <button id="review-approve-btn" class="btn btn-success" style="display:none">Approve</button>
            <button id="review-skip-btn" class="btn btn-secondary" style="display:none">Skip</button>
            <button id="review-reopen-btn" class="btn btn-secondary" style="display:none">Reopen</button>
          </div>
        </div>
        <div id="review-status"></div>
        <div id="review-draft" class="review-section"></div>
        <div id="review-proposals" class="review-section"></div>
        <div id="review-comments" class="review-section">
          <h4>Comments</h4>
          <div id="comments-thread"></div>
          <div class="comment-input-row">
            <textarea id="comment-input" rows="2" placeholder="Add a comment..."></textarea>
            <button id="submit-comment-btn" class="btn btn-primary">Send</button>
          </div>
        </div>
        <div id="review-empty" style="display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--text-secondary);">
          Select a section from the sidebar
        </div>
      </div>
      <div id="ai-log-panel" class="ai-log-collapsed" style="display:none">
        <div id="ai-log-toggle" class="ai-log-toggle">
          <span>AI Activity</span>
          <span id="ai-log-dot" class="ai-log-dot" style="display:none"></span>
        </div>
        <div id="ai-log-body" class="ai-log-body">
          <div id="ai-log-entries"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="invite-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>Invite Links</h3>
      <div id="invite-links-list"></div>
      <button id="close-invite-modal" class="btn btn-secondary">Close</button>
    </div>
  </div>

  <div id="publish-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>Publish Session</h3>
      <form id="publish-form">
        <label for="publish-plugin-select">Output Format</label>
        <select id="publish-plugin-select" required></select>
        <div id="publish-plugin-fields"></div>
        <div class="form-actions">
          <button type="button" id="cancel-publish-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Publish</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
